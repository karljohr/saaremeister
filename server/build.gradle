plugins {
    id 'application'
    id 'java-library'
}

application {
    mainClass = 'ee.kool.saaremeister.server.ServerLauncher'
}

repositories {
    mavenCentral()
    maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
    maven { url "https://oss.sonatype.org/content/repositories/releases/" }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

sourceSets.main.java.srcDirs = [ "src/" ]

distributions {
    main {
        contents {
            from("$rootDir/assets") {
                into "assets"
            }
        }
    }
}

dependencies {
    api "com.badlogicgames.gdx:gdx:1.12.1"
    implementation "com.badlogicgames.gdx:gdx-box2d:1.12.1"
    runtimeOnly "com.badlogicgames.gdx:gdx-box2d-platform:1.12.1:natives-desktop"
    api "com.esotericsoftware:kryonet:2.22.0-RC1"
    implementation project(':shared')

    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'

    testCompileOnly 'org.projectlombok:lombok:1.18.42'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.42'
}
